name: Deploy Kanboard to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Create Production Env File
        run: |
          echo "VITE_API_URL=http://${{ secrets.VM_PUBLIC_IP }}/api" > .env.production
          echo "VITE_SOCKET_URL=http://${{ secrets.VM_PUBLIC_IP }}" >> .env.production

      - name: Build Frontend Assets
        run: npm run build

      - name: Create Deploy Zip
        run: zip -r deploy.zip server/src server/package.json server/package-lock.json server/Dockerfile dist docker-compose.prod.yml Caddyfile

      - name: Copy Files to Azure VM via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: kanboard
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.zip"
          target: "~/kanboard/"

      - name: Execute Deploy Commands on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: kanboard
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/kanboard
            # Extract new deployment archive
            unzip -o deploy.zip && rm deploy.zip
            
            # Restart docker container services
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Wait for backend and database to be fully up
            echo "Waiting for services to spin up..."
            sleep 8
            
            # Check database connection and users table
            echo "Checking database status..."
            docker compose -f docker-compose.prod.yml exec -T database psql -U postgres -d kanboard -c "SELECT 1 FROM users LIMIT 1;" >/dev/null 2>&1
            DB_CHECK_STATUS=$?
            echo "Database check exit status: $DB_CHECK_STATUS"
            
            if [ $DB_CHECK_STATUS -ne 0 ]; then
              echo "⚠️ Database check failed or tables do not exist. Running database seed..."
              if ! docker compose -f docker-compose.prod.yml exec -T backend npm run seed; then
                echo "❌ Database seed failed! Printing container logs for troubleshooting:"
                docker compose -f docker-compose.prod.yml logs backend
                docker compose -f docker-compose.prod.yml logs database
                exit 1
              fi
              echo "✅ Database initialized and seeded successfully."
            else
              echo "✅ Database is already initialized. Skipping seed."
            fi
