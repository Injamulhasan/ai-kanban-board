services:
  postgres:
    image: postgres:17-alpine
    container_name: kanboard-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanboard
    volumes:
      - kanboard_pgdata:/var/lib/postgresql/data

volumes:
  kanboard_pgdata:
